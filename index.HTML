<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마이 웹툰 라이브러리</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  
  <style>
    /* 기존 세련된 다크모드 디자인 유지 */
    :root {
      --bg: #0f1115;
      --surface: #1a1d24;
      --border: #2e323b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #818cf8;
      --accent-hover: #6366f1;
      --danger: #fb7185;
      --danger-hover: #e11d48;
      --radius: 12px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 5%;
      position: sticky;
      top: 0;
      background: rgba(15, 17, 21, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      z-index: 100;
    }

    header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.5px; }

    button {
      cursor: pointer; border: none; border-radius: 8px;
      font-weight: 600; font-family: inherit; transition: var(--transition);
    }

    .btn-add {
      background-color: var(--accent); color: #fff; padding: 10px 18px;
      font-size: 0.95rem; box-shadow: 0 4px 12px rgba(129, 140, 248, 0.2);
    }
    .btn-add:hover { background-color: var(--accent-hover); transform: translateY(-2px); }

    .btn-action { padding: 8px 12px; font-size: 0.85rem; border-radius: 6px; flex: 1; }
    .btn-edit { background-color: rgba(255, 255, 255, 0.1); color: var(--text-main); }
    .btn-edit:hover { background-color: rgba(255, 255, 255, 0.2); }
    .btn-delete { background-color: rgba(251, 113, 133, 0.1); color: var(--danger); }
    .btn-delete:hover { background-color: var(--danger); color: #fff; }

    .controls-container { padding: 24px 5% 10px; max-width: 1400px; margin: 0 auto; }

    .search-bar {
      width: 100%; max-width: 400px; padding: 12px 16px; border-radius: var(--radius);
      border: 1px solid var(--border); background-color: var(--surface);
      color: var(--text-main); font-size: 0.95rem; transition: var(--transition); outline: none;
    }
    .search-bar:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.2); }

    .tabs { display: flex; gap: 24px; margin-top: 24px; border-bottom: 1px solid var(--border); }
    .tab {
      color: var(--text-muted); font-size: 1.05rem; font-weight: 500;
      cursor: pointer; padding-bottom: 12px; position: relative; transition: var(--transition);
    }
    .tab:hover { color: var(--text-main); }
    .tab.active { color: var(--accent); font-weight: 700; }
    .tab.active::after {
      content: ''; position: absolute; bottom: -1px; left: 0; right: 0;
      height: 3px; background-color: var(--accent); border-radius: 3px 3px 0 0;
    }

    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 24px; padding: 24px 5% 60px; max-width: 1400px; margin: 0 auto;
    }

    .empty-state {
      grid-column: 1 / -1; text-align: center; padding: 60px 20px;
      color: var(--text-muted); font-size: 1.1rem;
    }

    .card {
      background-color: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden; display: flex;
      flex-direction: column; transition: var(--transition);
    }
    .card:hover {
      transform: translateY(-6px); box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4);
      border-color: rgba(255, 255, 255, 0.1);
    }

    .card img {
      width: 100%; height: 280px; object-fit: cover;
      background-color: #2a2d35; border-bottom: 1px solid var(--border);
    }

    .card-info { padding: 16px; display: flex; flex-direction: column; flex-grow: 1; gap: 6px; }
    .card-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 4px; word-break: keep-all; }
    .card-meta { font-size: 0.85rem; color: var(--text-muted); display: flex; justify-content: space-between;}
    .star-rating { color: #fbbf24; letter-spacing: 2px; font-size: 0.9rem;}
    .card-actions { display: flex; gap: 8px; margin-top: 16px; }

    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px);
      justify-content: center; align-items: center; z-index: 999;
      opacity: 0; transition: opacity 0.3s ease;
    }
    .modal-overlay.active { display: flex; opacity: 1; }

    .modal {
      background-color: var(--surface); border: 1px solid var(--border);
      padding: 32px; border-radius: 16px; width: 90%; max-width: 420px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.5); transform: translateY(20px);
      transition: transform 0.3s ease;
    }
    .modal-overlay.active .modal { transform: translateY(0); }
    .modal h2 { margin-bottom: 24px; font-size: 1.4rem; text-align: center; }

    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px; }
    .form-group input, .form-group select {
      width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border);
      background-color: var(--bg); color: white; font-size: 0.95rem;
      transition: var(--transition); outline: none;
    }
    .form-group input:focus, .form-group select:focus { border-color: var(--accent); }

    .modal-actions { display: flex; gap: 12px; margin-top: 24px; }
    .modal-actions button { flex: 1; padding: 12px; font-size: 1rem; }
    .btn-submit { background-color: var(--accent); color: #fff; }
    .btn-submit:hover { background-color: var(--accent-hover); }
    .btn-close { background-color: transparent; border: 1px solid var(--border); color: var(--text-main); }
    .btn-close:hover { background-color: rgba(255, 255, 255, 0.05); }

  </style>
</head>
<body>

  <header>
    <h1>📚 마이 웹툰 라이브러리</h1>
    <button class="btn-add" onclick="window.openModal()">+ 새 웹툰 추가</button>
  </header>

  <div class="controls-container">
    <input type="text" class="search-bar" id="searchInput" placeholder="웹툰 제목을 검색해 보세요..." onkeyup="window.renderWebtoons()">
    
    <nav class="tabs">
      <div class="tab active" onclick="window.changeTab('reading', this)">보는 중</div>
      <div class="tab" onclick="window.changeTab('completed', this)">다 봄</div>
      <div class="tab" onclick="window.changeTab('dropped', this)">하차함</div>
    </nav>
  </div>

  <main class="grid" id="webtoonGrid">
    </main>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2 id="modalTitle">웹툰 기록하기</h2>
      <form id="webtoonForm">
        <input type="hidden" id="toonId">
        <div class="form-group">
          <label>제목</label>
          <input type="text" id="title" required placeholder="웹툰 제목을 입력하세요">
        </div>
        <div class="form-group">
          <label>썸네일 이미지 URL (선택)</label>
          <input type="url" id="image" placeholder="https://...">
        </div>
        <div class="form-group" style="display: flex; gap: 12px;">
          <div style="flex: 1;">
            <label>현재 본 화수</label>
            <input type="number" id="episode" required min="0" placeholder="ex) 120">
          </div>
          <div style="flex: 1;">
            <label>별점 (1~5)</label>
            <input type="number" id="rating" required min="1" max="5" placeholder="5">
          </div>
        </div>
        <div class="form-group">
          <label>상태</label>
          <select id="status">
            <option value="reading">보는 중</option>
            <option value="completed">다 봄</option>
            <option value="dropped">하차함</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-close" onclick="window.closeModal()">취소</button>
          <button type="button" class="btn-submit" onclick="window.saveWebtoon()">저장하기</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    // 1. Firebase 핵심 모듈 불러오기
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, query, orderBy } 
    from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    // 2. ★여기에 발급받은 Firebase Config 코드를 덮어써줘!★
    const firebaseConfig = {
    apiKey: "AIzaSyC7s9y0lAqkjhJN7jsIjIBsHyJBpAIwOwE",
    authDomain: "my-webtoon-lib.firebaseapp.com",
    projectId: "my-webtoon-lib",
    storageBucket: "my-webtoon-lib.firebasestorage.app",
    messagingSenderId: "961716383432",
    appId: "1:961716383432:web:52ac0a6c04d91c76e47ffd"
  };


    // Firebase 초기화
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 전역 변수
    let webtoons = [];
    let currentTab = 'reading';

    // DB에서 데이터 불러오기
    async function loadWebtoons() {
      try {
        const q = query(collection(db, "webtoons"));
        const querySnapshot = await getDocs(q);
        webtoons = [];
        querySnapshot.forEach((doc) => {
          webtoons.push({ id: doc.id, ...doc.data() }); // DB 문서 ID를 포함해서 저장
        });
        
        // 최신 등록순으로 정렬 (선택 사항)
        webtoons.sort((a, b) => b.createdAt - a.createdAt);
        window.renderWebtoons();
      } catch (error) {
        console.error("데이터를 불러오는 중 에러 발생:", error);
        alert("데이터를 불러오지 못했습니다. 콘솔을 확인해 주세요.");
      }
    }

    // 데이터 저장/수정 함수 (Firebase)
    window.saveWebtoon = async function() {
      const idInput = document.getElementById('toonId').value;
      const title = document.getElementById('title').value;
      const image = document.getElementById('image').value || 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=300&q=80';
      const episode = document.getElementById('episode').value;
      const rating = document.getElementById('rating').value;
      const status = document.getElementById('status').value;

      if(!title || !episode || !rating) {
        alert("필수 항목을 모두 입력해 주세요!");
        return;
      }

      // 저장 버튼 비활성화 (중복 클릭 방지)
      const submitBtn = document.querySelector('.btn-submit');
      submitBtn.innerText = '저장 중...';
      submitBtn.disabled = true;

      const toonData = {
        title, image, episode: parseInt(episode), rating: parseInt(rating), status, 
        updatedAt: Date.now()
      };

      try {
        if (idInput) {
          // 수정: 기존 문서 업데이트
          const toonRef = doc(db, "webtoons", idInput);
          await updateDoc(toonRef, toonData);
        } else {
          // 신규: 새 문서 추가 (생성 시간 추가)
          toonData.createdAt = Date.now();
          await addDoc(collection(db, "webtoons"), toonData);
        }
        
        window.closeModal();
        await loadWebtoons(); // DB 새로고침
      } catch (error) {
        console.error("저장 중 에러 발생:", error);
        alert("저장에 실패했습니다.");
      } finally {
        submitBtn.innerText = '저장하기';
        submitBtn.disabled = false;
      }
    };

    // 데이터 삭제 함수 (Firebase)
    window.deleteWebtoon = async function(id) {
      if(confirm('정말 이 웹툰 기록을 삭제하시겠습니까?')) {
        try {
          await deleteDoc(doc(db, "webtoons", id));
          await loadWebtoons(); // DB 새로고침
        } catch (error) {
          console.error("삭제 중 에러 발생:", error);
          alert("삭제에 실패했습니다.");
        }
      }
    };

    // 화면 렌더링 함수
    window.renderWebtoons = function() {
      const grid = document.getElementById('webtoonGrid');
      grid.innerHTML = ''; 

      const searchInput = document.getElementById('searchInput');
      const queryText = searchInput ? searchInput.value.toLowerCase() : '';

      const filtered = webtoons.filter(toon => {
        const matchStatus = toon.status === currentTab;
        const matchSearch = toon.title.toLowerCase().includes(queryText);
        return matchStatus && matchSearch;
      });

      if(filtered.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            해당하는 웹툰 기록이 없습니다.<br>
            <span style="font-size: 0.9rem; margin-top: 8px; display: inline-block;">우측 상단의 '+ 새 웹툰 추가' 버튼을 눌러 기록을 시작해 보세요.</span>
          </div>`;
        return;
      }

      filtered.forEach(toon => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${toon.image}" alt="${toon.title} 썸네일">
          <div class="card-info">
            <h3 class="card-title">${toon.title}</h3>
            <div class="card-meta">
              <span>최근 감상: ${toon.episode}화</span>
            </div>
            <div class="star-rating">${'★'.repeat(toon.rating)}${'☆'.repeat(5 - toon.rating)}</div>
            <div class="card-actions">
              <button class="btn-action btn-edit" onclick="window.editWebtoon('${toon.id}')">수정</button>
              <button class="btn-action btn-delete" onclick="window.deleteWebtoon('${toon.id}')">삭제</button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    };

    // 탭 변경 함수
    window.changeTab = function(status, element) {
      currentTab = status;
      document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
      if(element) element.classList.add('active');
      window.renderWebtoons();
    };

    // 모달 제어 함수들
    window.editWebtoon = function(id) {
      const toon = webtoons.find(t => t.id === id);
      if(!toon) return;

      document.getElementById('modalTitle').innerText = '웹툰 정보 수정';
      document.getElementById('toonId').value = toon.id;
      document.getElementById('title').value = toon.title;
      document.getElementById('image').value = toon.image.includes('unsplash') ? '' : toon.image;
      document.getElementById('episode').value = toon.episode;
      document.getElementById('rating').value = toon.rating;
      document.getElementById('status').value = toon.status;

      document.getElementById('modalOverlay').classList.add('active');
    };

    window.openModal = function() {
      document.getElementById('webtoonForm').reset();
      document.getElementById('toonId').value = '';
      document.getElementById('modalTitle').innerText = '새 웹툰 기록하기';
      document.getElementById('modalOverlay').classList.add('active');
    };

    window.closeModal = function() {
      document.getElementById('modalOverlay').classList.remove('active');
    };

    // 모달 배경 클릭 시 닫기
    document.getElementById('modalOverlay').addEventListener('click', function(e) {
      if (e.target === this) {
        window.closeModal();
      }
    });

    // 페이지 로드 시 최초 데이터 불러오기 실행
    loadWebtoons();

  </script>
</body>
</html>
